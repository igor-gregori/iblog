<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Análises de dados do Igor Gregori: perguntas do dia a dia respondidas com dados públicos e as contas abertas."
    />
    <title>Posts · Igor Gregori</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando um flash de tema errado.
      (function () {
        var pref
        try {
          pref = JSON.parse(localStorage.getItem('posts:tema'))
        } catch (e) {}
        var escuro = pref === 'escuro' || (pref !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = escuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <header class="topo">
      <a href="/">Igor Gregori</a>
      <button class="botao-tema" type="button" id="botao-tema">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path />
        </svg>
      </button>
    </header>

    <main class="capa">
      <header class="abertura">
        <p class="sobretitulo">Análises de dados</p>
        <h1>Posts</h1>
        <p class="subtitulo">
          Perguntas do dia a dia respondidas com dados públicos. Cada análise mostra as contas, as fontes e o código,
          para quem quiser conferir.
        </p>
      </header>

      <ol class="posts" reversed>
        <!-- posts -->
      </ol>

      <footer class="rodape">
        <p>
          Escrito por Igor Gregori. O código de cada análise está no
          <a href="https://github.com/igor-gregori" target="_blank" rel="noreferrer">GitHub</a>, e os outros projetos,
          em <a href="https://apps.igreg.dev">apps.igreg.dev</a>.
        </p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
