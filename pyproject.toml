[project]
name = "juro-negativo"
version = "0.1.0"
description = "O juro é negativo depois de 2008? Um teste, com dados públicos, da tese do Trezoitão."
readme = "README.md"
authors = [
    { name = "Igor", email = "igsilvacarlos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# DTZ: as datas aqui são dias de calendário, sem fuso horário. C408: dict(a=1) é mais legível nos testes.
ignore = ["DTZ", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
